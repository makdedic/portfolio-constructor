name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # python -m pytest, not bare pytest: without -m, pytest doesn't add the
      # repo root to sys.path, and every test module fails to import "src".
      - run: python -m pytest tests/unit -v
